<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d82c46"><title>メルカリ出品サポート</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><small>無料・端末内で処理</small><h1>出品サポート</h1><p>写真を整えて、商品説明をすばやく作成</p></div></header><main class="wrap"><section class="card"><h2><span>1</span> 商品写真</h2><label class="upload" for="photos">＋ 写真を選ぶ（最大10枚）<input id="photos" type="file" accept="image/*" multiple></label><div id="thumbs" class="thumbs"></div><div id="editor" hidden><p class="hint">編集する写真をタップしてください。補正は選択中の写真に適用します。</p><canvas id="preview"></canvas><label>明るさ <output id="brightnessValue">100%</output><input id="brightness" type="range" min="60" max="150" value="100"></label><label>コントラスト <output id="contrastValue">100%</output><input id="contrast" type="range" min="70" max="140" value="100"></label><label>彩度 <output id="saturationValue">100%</output><input id="saturation" type="range" min="70" max="130" value="100"></label><div class="row"><button id="reset" class="secondary">補正を戻す</button><button id="download">この写真を保存</button></div><button id="downloadAll" class="secondary wide">全写真をまとめて保存（1枚ずつ）</button></div><p class="hint">傷や汚れは隠さず、実物に近い色を保ってください。背景除去・AI商品認識は未搭載です。</p></section><section class="card"><h2><span>2</span> 商品情報</h2><label>商品名 <b>必須</b><input id="product" placeholder="例：スニーカー" maxlength="80"></label><label>ブランド<input id="brand" placeholder="例：NIKE"></label><div class="grid"><label>サイズ<input id="size" placeholder="例：27cm"></label><label>色<input id="color" placeholder="例：黒"></label></div><label>商品の状態<select id="condition"><option value="">選択してください</option><option>新品、未使用</option><option>未使用に近い</option><option>目立った傷や汚れなし</option><option>やや傷や汚れあり</option><option>傷や汚れあり</option><option>全体的に状態が悪い</option></select></label><label>使用期間・購入時期（任意）<input id="period" placeholder="例：半年ほど使用"></label><label>傷・汚れ・動作状態など（任意）<textarea id="details" rows="3" placeholder="例：かかとに擦れあり。動作確認済み"></textarea></label><label>付属品（任意）<input id="accessories" placeholder="例：箱あり"></label><button id="generate" class="wide">タイトル・説明文を作成</button></section><section class="card" id="results" hidden><h2><span>3</span> コピーして出品</h2><label>タイトル <small id="titleCount"></small><textarea id="titleText" rows="2" maxlength="40"></textarea></label><button class="secondary copy" data-target="titleText">タイトルをコピー</button><label>説明文<textarea id="descriptionText" rows="12"></textarea></label><button class="copy wide" data-target="descriptionText">説明文をコピー</button><p class="hint">自動生成は入力情報を文章に整える方式です。未確認情報を補わず、内容を確認してから出品してください。</p></section></main><footer>出品サポート 試作版 | 写真・入力内容はサーバーに送信しません</footer><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>

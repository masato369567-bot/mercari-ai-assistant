<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24343c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="出品メーカー"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png" type="image/png"><link rel="stylesheet" href="style.css"><title>出品メーカー</title></head><body><header><div class="eyebrow">LISTING STUDIO</div><h1>出品を、もっと美しく。</h1><p>写真の文字入れと出品文作成</p></header><main><div class="chips"><span>PHOTO DESIGN</span><span>LISTING TEXT</span><span>FREE</span></div><section class="card"><h2>01 / 商品写真</h2><label class="upload">写真を選択<input id="photo" type="file" accept="image/*"></label><label>画像の比率<select id="aspect"><option value="original">元画像の比率（初期設定）</option><option value="square">正方形 1080 × 1080</option><option value="portrait">縦長 1080 × 1350</option><option value="landscape">横長 1350 × 1080</option></select></label><p class="hint">写真を指で移動、2本指で拡大縮小できます。元画像の比率では切り抜きません。</p><canvas id="canvas" width="1080" height="1080"></canvas><div class="row"><button class="sub" id="zoomOut">縮小</button><button class="sub" id="zoomIn">拡大</button><button class="sub" id="resetPhoto">位置を戻す</button></div><label>左上：ブランド名<input id="brand" placeholder="例：NIKE"></label><label>右上：任意の文字<input id="badge" placeholder="例：27cm（空欄なら非表示）"></label><div class="grid"><label>文字サイズ<input type="range" id="fontSize" min="28" max="90" value="55"></label><label>文字背景の濃さ<input type="range" id="opacity" min="40" max="100" value="88"></label></div><button id="saveImage">写真を保存・共有</button><p class="hint">iPhoneは共有メニューから「画像を保存」を選択してください。カメラロールへの無操作の直接保存はできません。</p></section><section class="card"><h2>02 / 商品情報</h2><label>カテゴリー<select id="category"><option value="general">その他・共通</option><option value="shoes">靴・スニーカー</option><option value="clothes">衣類</option><option value="bags">バッグ</option><option value="electronics">家電・ゲーム</option></select></label><label>商品名（必須）<input id="product" placeholder="例：エアマックス スニーカー"></label><div class="grid"><label>サイズ<input id="size" placeholder="例：27cm"></label><label>カラー<input id="color" placeholder="例：ブラック"></label></div><label>商品の状態<select id="condition"><option value="">選択してください</option><option>新品、未使用</option><option>未使用に近い</option><option>目立った傷や汚れなし</option><option>やや傷や汚れあり</option><option>傷や汚れあり</option><option>全体的に状態が悪い</option></select></label><label>付属品<input id="accessories" placeholder="例：箱なし"></label><div id="categoryFields" class="category-fields"></div><label>状態・補足<input id="details" placeholder="例：購入時期、使用期間、注意点"></label><button id="generate">タイトル・説明文を作成</button></section><section class="card"><h2>03 / 共通文章</h2><p class="hint">文章の変更とON/OFFはこの端末に保存されます。事実と異なる文章はOFFにしてください。</p><div id="common"></div><label>その他の共通文章<textarea id="extra" rows="3" placeholder="自由入力"></textarea></label><div class="row"><button class="sub" id="saveSettings">共通文章を保存</button><button class="sub" id="resetSettings">初期設定に戻す</button></div></section><section class="card" id="result" hidden><h2>04 / 完成した文章</h2><label>商品タイトル（最大40文字）<textarea id="title" maxlength="40" rows="2"></textarea></label><button class="sub copy" data-id="title">タイトルをコピー</button><label>商品説明文<textarea id="description" rows="13"></textarea></label><button class="copy" data-id="description">説明文をコピー</button></section><p class="footer">出品メーカー / 個人用ツール・メルカリ公式ではありません</p></main><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
